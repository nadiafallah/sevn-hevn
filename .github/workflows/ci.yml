name: CI

# Every push to main and every pull request: migration tests (in-process Postgres, no network)
# plus typecheck, lint and a production build. Vercel deploys separately via its GitHub app.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test database migrations
        run: npm run db:test
      - name: Typecheck, lint and build
        run: npm run check
